# Publish the SvelteKit static site to the gh-pages branch.
#
# Checkout, build, and publish are separate jobs. The build job has no
# GITHUB_TOKEN scopes, and the publish job starts on a fresh runner from the
# uploaded artifact. A dependency that runs during install or build therefore
# cannot read the token that pushes gh-pages or change that job's environment.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  source:
    name: Checkout source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Drop git metadata
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: rm -rf .git

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

  build:
    name: Build static site
    needs: source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
          path: .
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          cache: false
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Do not send the permissionless job token. It cannot read
          # actions/node-versions and is not a build credential.
          token: ''
          package-manager-cache: false
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          NODE_AUTH_TOKEN: ''

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
        run: pnpm build

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          # adapter-static writes prerendered files here.
          path: build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

  deploy:
    name: Publish gh-pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

      - name: Check site artifact
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: test -f site/index.html

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
